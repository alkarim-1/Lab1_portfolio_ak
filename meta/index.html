<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta - Code Analysis</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>

    <script type="module" src="main.js"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>
        This page explores statistics and visualizations
        about the code used to build my website.
    </p>

    <div id="stats"></div>
    <h2>Commits by time of day</h2>
    <div id="chart"></div>

    <!-- Step 5.5: Selected commit count -->
    <p id="selection-count">No commits selected</p>

    <!-- Step 5.6: Language breakdown -->
    <h3>Language Breakdown</h3>
    <dl id="language-breakdown" class="info"></dl>

    <!-- Step 3: Commit tooltip -->
    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a href="" id="commit-link" target="_blank" rel="noopener noreferrer"></a>
        </dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-time"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
    </dl>
</body>
</html>
